# Overrides on top of the detekt default config (buildUponDefaultConfig = true)

complexity:
  LongMethod:
    excludes:
      - "**/test/**"
  NestedBlockDepth:
    allowedDepth: 6
  TooManyFunctions:
    allowedFunctionsPerFile: 20
    allowedFunctionsPerClass: 20
    allowedFunctionsPerInterface: 20
    allowedFunctionsPerObject: 20
    allowedFunctionsPerEnum: 20

empty-blocks:
  EmptyFunctionBlock:
    ignoreOverridden: true

style:
  MagicNumber:
    active: false
  ReturnCount:
    max: 10
  ThrowsCount:
    max: 10
  UseRequire:
    active: false
